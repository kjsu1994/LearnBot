services:
  backend:
    environment:
      LEARNBOT_LOCAL_AGENT_WEBSOCKET_ENABLED: "true"
      LEARNBOT_LOCAL_AGENT_PATCH_EXECUTION_RELEASE_ENABLED: "true"
      LEARNBOT_LOCAL_AGENT_APPROVED_EXECUTION_SEQUENCE_CREATION_ENABLED: "true"
      LEARNBOT_LOCAL_AGENT_LATEST_VERSION: ${LEARNBOT_LOCAL_AGENT_LATEST_VERSION:-0.2.0.0}
      LEARNBOT_LOCAL_AGENT_MINIMUM_VERSION: ${LEARNBOT_LOCAL_AGENT_MINIMUM_VERSION:-0.1.0.0}
      LEARNBOT_LOCAL_AGENT_UPDATE_URI: ${LEARNBOT_LOCAL_AGENT_UPDATE_URI:-/downloads/local-agent/stable/LearnBotLocalAgent.appinstaller}
