events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    resolver 127.0.0.11 valid=10s ipv6=off;
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }
    map $uri $local_agent_download_cache {
        default "no-cache";
        ~^/downloads/local-agent/releases/ "public, max-age=31536000, immutable";
    }
    # The image installs the trusted-edge policy by default. The direct LAN
    # Compose profile replaces only this include with a policy that ignores
    # supplied edge headers and accepts only the server IP selected at setup.
    include /etc/nginx/conf.d/client-ip-policy.inc;

    server {
        listen 80;
        server_name _;
        client_max_body_size 512m;

        if ($learnbot_host_allowed = 0) { return 444; }

        root /usr/share/nginx/client;
        index index.html;

        location ^~ /downloads/local-agent/ {
            root /usr/share/nginx;
            types {
                application/appinstaller appinstaller;
                application/msix msix;
                application/pkix-cert cer;
                application/json json;
            }
            default_type application/octet-stream;
            try_files $uri =404;
            add_header Cache-Control $local_agent_download_cache always;
            add_header X-Content-Type-Options nosniff always;
        }

        location = /api/rag/ask/stream {
            set $backend_upstream backend:8080;
            proxy_pass http://$backend_upstream;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_cache off;
            gzip off;
            proxy_connect_timeout 60s;
            proxy_send_timeout 600s;
            proxy_read_timeout 600s;
            proxy_set_header Connection '';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $learnbot_client_ip;
            proxy_set_header X-Forwarded-For $learnbot_client_ip;
            proxy_set_header X-Forwarded-Proto $learnbot_forwarded_proto;
            add_header X-Accel-Buffering no always;
            add_header Cache-Control no-cache always;
        }

        location = /api/code/ask/stream {
            set $backend_upstream backend:8080;
            proxy_pass http://$backend_upstream;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_cache off;
            gzip off;
            proxy_connect_timeout 60s;
            proxy_send_timeout 600s;
            proxy_read_timeout 600s;
            proxy_set_header Connection '';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $learnbot_client_ip;
            proxy_set_header X-Forwarded-For $learnbot_client_ip;
            proxy_set_header X-Forwarded-Proto $learnbot_forwarded_proto;
            add_header X-Accel-Buffering no always;
            add_header Cache-Control no-cache always;
        }

        location = /api/local-agents/ws {
            set $backend_upstream backend:8080;
            proxy_pass http://$backend_upstream;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_cache off;
            proxy_connect_timeout 60s;
            proxy_send_timeout 3600s;
            proxy_read_timeout 3600s;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $learnbot_client_ip;
            proxy_set_header X-Forwarded-For $learnbot_client_ip;
            proxy_set_header X-Forwarded-Proto $learnbot_forwarded_proto;
        }

        location /api/ {
            set $backend_upstream backend:8080;
            proxy_pass http://$backend_upstream;
            proxy_http_version 1.1;
            proxy_connect_timeout 60s;
            proxy_send_timeout 600s;
            proxy_read_timeout 600s;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $learnbot_client_ip;
            proxy_set_header X-Forwarded-For $learnbot_client_ip;
            proxy_set_header X-Forwarded-Proto $learnbot_forwarded_proto;
        }

        location / {
            try_files $uri /index.html;
        }
    }
}
